        D: "BEAUTIFUL means attractive - not about expression."
      }
    }
  }
];

            // ========== END OF 421 QUESTION INTEGRATION ==========
            
            // Use the full question bank
            const EXAM_QUESTIONS = FULL_421_QUESTIONS;
            const EXAM_SIZE = 100; // Only 100 questions per attempt
            
            // ---------- CBT STATE ----------
            let currentIndex = 0;
            let selectedQuestions = []; // 100 selected for this attempt
            let userAnswers = new Array(EXAM_SIZE).fill(null);
            let examSubmitted = false;
            let timeLeft = 150 * 60; // 150 minutes in seconds
            let timerInterval = null;
            let reviewMode = false;
            let questionOrder = [];

            // ---------- STUDENT INFO ----------
            let studentInfo = { name: '', examNumber: '', class: '' };

            // ---------- SECURITY LOCKDOWN ----------
            document.addEventListener('copy', (e) => { e.preventDefault(); alert('📵 COPY DISABLED · Scholar\'s Camp'); });
            document.addEventListener('cut', (e) => { e.preventDefault(); });
            document.addEventListener('paste', (e) => { e.preventDefault(); alert('Pasting is forbidden'); });
            document.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
            
            // Devtools detection
            setInterval(() => {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 100) {
                    document.body.innerHTML = '<div style="background:black; color:red; padding:3rem; font-size:2rem;">⚠️ DEVTOOLS DETECTED · EXAM TERMINATED</div>';
                    clearInterval(timerInterval);
                }
            }, 2000);

            // Tab blur auto-submit after 2 minutes
            let blurTimer = null;
            window.addEventListener('blur', () => {
                if (examSubmitted) return;
                blurTimer = setTimeout(() => {
                    if (!examSubmitted) {
                        alert('🚫 You left the exam page for 2 minutes. Auto-submitted.');
                        submitExam();
                    }
                }, 120000);
            });
            window.addEventListener('focus', () => { clearTimeout(blurTimer); blurTimer = null; });

            // Disable refresh / F5 / devtools shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.shiftKey && e.key === 'i') || (e.metaKey && e.altKey && e.key === 'i')) {
                    e.preventDefault(); alert('Refreshing / devtools blocked'); return false;
                }
            });

            // ---------- SHUFFLE QUESTIONS ----------
            function shuffleArray(arr) {
                let copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function initShuffledOrder() {
                // Shuffle all 421, pick first 100
                let allIndices = EXAM_QUESTIONS.map((_, idx) => idx);
                allIndices = shuffleArray(allIndices);
                questionOrder = allIndices.slice(0, EXAM_SIZE);
                selectedQuestions = questionOrder.map(i => EXAM_QUESTIONS[i]);
                currentIndex = 0;
            }

            // ---------- RENDER CURRENT QUESTION ----------
            function renderQuestion(index) {
                if (examSubmitted && !reviewMode) return;
                const container = document.getElementById('examContainer');
                if (!container) return;
                
                const q = selectedQuestions[index];
                const selected = userAnswers[index];
                
                let html = `<div class="progress-area">
                                <span class="q-counter">Q${index+1} / ${EXAM_SIZE}</span>
                                <span>🏆 ${userAnswers.filter(a => a !== null).length} answered</span>
                            </div>
                            <div class="question-screen">
                                <div class="q-text">${q.id}. ${q.question}</div>
                                <div class="options-list" id="optGroup">`;
                
                const letters = ['A', 'B', 'C', 'D'];
                letters.forEach(opt => {
                    const isSelected = (selected === opt);
                    html += `<div class="option-item ${isSelected ? 'selected' : ''}" data-opt="${opt}">
                                <span class="opt-char">${opt}</span>
                                <span class="opt-text">${q.options[opt] || ''}</span>
                            </div>`;
                });
                
                html += `</div></div>`;
                html += `<div class="nav-buttons">
                            <button class="nav-btn" id="prevBtn" ${index === 0 ? 'disabled' : ''}>← PREVIOUS</button>
                            <button class="nav-btn" id="nextBtn" ${index === EXAM_SIZE-1 ? 'disabled' : ''}>NEXT →</button>
                        </div>
                        <div style="display:flex; justify-content:center; margin-top:10px;">
                            <button class="nav-btn submit-final" id="submitFinalBtn">✅ SUBMIT FINAL EXAM</button>
                        </div>`;
                container.innerHTML = html;
                
                document.querySelectorAll('.option-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (examSubmitted) return;
                        const opt = this.dataset.opt;
                        userAnswers[index] = opt;
                        renderQuestion(index);
                    });
                });
                
                document.getElementById('prevBtn')?.addEventListener('click', () => { if (!examSubmitted) { currentIndex--; renderQuestion(currentIndex); } });
                document.getElementById('nextBtn')?.addEventListener('click', () => { if (!examSubmitted) { currentIndex++; renderQuestion(currentIndex); } });
                document.getElementById('submitFinalBtn')?.addEventListener('click', submitExam);
            }

            // ---------- TIMER ----------
            function startTimer() {
                timerInterval = setInterval(() => {
                    if (examSubmitted) { clearInterval(timerInterval); return; }
                    timeLeft--;
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(3,' ')}:${secs.toString().padStart(2,'0')}`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        alert('⏰ TIME IS UP! Auto-submitting.');
                        submitExam();
                    }
                }, 1000);
            }

            // ---------- SUBMIT EXAM & SHOW REVIEW ----------
            function submitExam() {
                if (examSubmitted) return;
                examSubmitted = true;
                reviewMode = true;
                clearInterval(timerInterval);
                
                let correctCount = 0;
                selectedQuestions.forEach((q, idx) => {
                    const userAns = userAnswers[idx] || null;
                    if (userAns === q.correctAnswer) correctCount++;
                });
                
                let scorePercent = ((correctCount / EXAM_SIZE) * 100).toFixed(2);
                storeStudentRecord(correctCount, scorePercent);
                
                const container = document.getElementById('examContainer');
                let reviewHtml = `<div style="background:#2f6d4a; color:white; padding:26px; border-radius:36px; margin-bottom:26px; text-align:center;">
                                    <h1 style="font-size:2.4rem;">🎓 SCORE: ${correctCount}/${EXAM_SIZE}</h1>
                                    <p style="font-size:1.5rem;">${scorePercent}% · SCHOLAR'S CAMP</p>
                                    <p style="margin-top:12px;">✅ CANDIDATE: ${studentInfo.name} (${studentInfo.examNumber}) · ${studentInfo.class}</p>
                                </div>`;
                reviewHtml += `<h2 style="color:#faedcd; margin-bottom:10px;">🔍 COMPLETE EXAM REVIEW</h2>`;
                reviewHtml += `<div class="review-panel" id="fullReview">`;
                
                // Show all 100 questions with explanations
                selectedQuestions.forEach((q, idx) => {
                    const userAns = userAnswers[idx];
                    const isCorrect = (userAns === q.correctAnswer);
                    reviewHtml += `<div class="review-card" style="border-left-color: ${isCorrect ? '#1f9a7a' : '#b0422e'};">
                                    <strong style="font-size:1.3rem;">Q${idx+1} (ID: ${q.id})</strong> ${q.question}
                                    <div style="display:flex; gap:20px; margin-top:6px; flex-wrap:wrap;">
                                        <span>✅ Your answer: ${userAns ? userAns + ' - ' + (q.options[userAns] || '') : '⛔ Not answered'}</span>
                                        <span style="background: #0b4f5e; color:white; padding:4px 16px; border-radius:40px;">✔ Correct: ${q.correctAnswer} - ${q.options[q.correctAnswer]}</span>
                                    </div>
                                    <div class="explain-good">✔ WHY CORRECT: ${q.explanation.correct}</div>
                                    <div class="explain-bad">✖ WHY OTHERS WRONG: <br>`;
                    if (q.explanation.wrong) {
                        Object.entries(q.explanation.wrong).forEach(([opt, txt]) => {
                            reviewHtml += `<span style="display:block;">❌ ${opt}: ${txt}</span>`;
                        });
                    }
                    reviewHtml += `</div></div>`;
                });
                reviewHtml += `</div><div style="margin-top:24px; display:flex; gap:16px; flex-wrap:wrap;">
                    <button class="nav-btn" id="restartBtn" style="flex:1;">🔄 START NEW EXAM</button>
                    <button class="nav-btn" id="goStudyBtn" style="flex:1; background:#2d6a3a; color:white; border-bottom-color:#0f3318;">📖 STUDY ALL 421 Q</button>
                </div>`;
                container.innerHTML = reviewHtml;
                document.getElementById('restartBtn')?.addEventListener('click', restartExam);
                document.getElementById('goStudyBtn')?.addEventListener('click', openStudyMode);
                updateRecordsDisplay();
            }

            // ---------- STUDENT RECORDS (LOCALSTORAGE) ----------
            function storeStudentRecord(score, percent) {
                let records = JSON.parse(localStorage.getItem('scholarGrammarRecords') || '[]');
                const attempt = {
                    date: new Date().toLocaleString(),
                    score: `${score}/${EXAM_QUESTIONS.length}`,
                    percent: percent,
                    student: `${studentInfo.name} | ${studentInfo.examNumber} | ${studentInfo.class}`
                };
                records.unshift(attempt);
                if (records.length > 7) records.pop();
                localStorage.setItem('scholarGrammarRecords', JSON.stringify(records));
                updateRecordsDisplay();
            }

            function updateRecordsDisplay() {
                let records = JSON.parse(localStorage.getItem('scholarGrammarRecords') || '[]');
                let html = '📁 Previous: ';
                if (records.length === 0) html += 'No records';
                else {
                    html += records.map(r => `${r.student || '?'} ${r.score} (${r.percent}%)`).join(' · ');
                }
                document.getElementById('studentRecords').innerHTML = `<span>📋 Last attempt: ${records[0]?.date || '--'}</span><span id="scoreHistory">${html}</span>`;
            }

            // ---------- RESTART EXAM ----------
            function restartExam() {
                document.getElementById('registrationArea').style.display = 'block';
                document.getElementById('examContainer').style.display = 'none';
                document.getElementById('examContainer').innerHTML = '';
                document.getElementById('studyContainer').style.display = 'none';
                document.getElementById('studyContainer').innerHTML = '';
                // reset state
                userAnswers = new Array(EXAM_SIZE).fill(null);
                selectedQuestions = [];
                examSubmitted = false;
                reviewMode = false;
                timeLeft = 150 * 60;
                clearInterval(timerInterval);
                document.getElementById('studentName').value = '';
                document.getElementById('examNumber').value = '';
                document.getElementById('studentClass').value = 'SS3';
                studentInfo = { name: '', examNumber: '', class: '' };
                updateRecordsDisplay();
                document.getElementById('securityWarning').innerHTML = `
                    <span>⛔ NO COPY · NO REFRESH · DEVTOOLS BLOCKED</span>
                    <span>🚫 LEAVE >2MIN = AUTO-SUBMIT</span>
                    <span id="pasteBlockMsg" style="color:#ffb86b;">⌨️ PASTE DISABLED</span>
                    <span class="timer-box" id="timerDisplay">150:00</span>
                `;
            }

            // ---------- INITIALISE CBT via REGISTRATION ----------
            function handleStartExam() {
                const nameInput = document.getElementById('studentName').value.trim();
                const examNum = document.getElementById('examNumber').value.trim();
                const classSelect = document.getElementById('studentClass').value;
                if (!nameInput || !examNum) {
                    alert('Please enter your full name and examination number.');
                    return;
                }
                // store student info
                studentInfo = { name: nameInput, examNumber: examNum, class: classSelect };
                
                // hide registration, show exam container
                document.getElementById('registrationArea').style.display = 'none';
                document.getElementById('examContainer').style.display = 'block';
                
                // reset exam state
                userAnswers = new Array(EXAM_SIZE).fill(null);
                examSubmitted = false;
                reviewMode = false;
                timeLeft = 150 * 60;
                initShuffledOrder();
                // clear any previous timer
                if (timerInterval) clearInterval(timerInterval);
                startTimer();
                renderQuestion(0);
                updateRecordsDisplay();

                // optional: add student badge near timer? we can update security ribbon
                document.getElementById('securityWarning').innerHTML = `
                    <span>⛔ ${studentInfo.name} (${studentInfo.examNumber})</span>
                    <span>🚫 LEAVE >2MIN = AUTO-SUBMIT</span>
                    <span>⌨️ PASTE DISABLED</span>
                    <span class="timer-box" id="timerDisplay">150:00</span>
                `;
            }

            // ---------- STUDY MODE ----------
            let studyPage = 0;
            const STUDY_PER_PAGE = 20;
            let studyFilter = '';

            function openStudyMode() {
                document.getElementById('registrationArea').style.display = 'none';
                document.getElementById('examContainer').style.display = 'none';
                const container = document.getElementById('studyContainer');
                container.style.display = 'block';
                studyPage = 0;
                studyFilter = '';
                renderStudyPage();
            }

            function renderStudyPage() {
                const container = document.getElementById('studyContainer');
                const filtered = studyFilter
                    ? FULL_421_QUESTIONS.filter(q => q.question.toLowerCase().includes(studyFilter.toLowerCase()) || Object.values(q.options).some(o => o.toLowerCase().includes(studyFilter.toLowerCase())))
                    : FULL_421_QUESTIONS;
                const totalPages = Math.ceil(filtered.length / STUDY_PER_PAGE);
                const start = studyPage * STUDY_PER_PAGE;
                const pageQ = filtered.slice(start, start + STUDY_PER_PAGE);

                let html = `<div class="study-header">
                    <h2>📖 STUDY GUIDE · ALL 421 QUESTIONS</h2>
                    <button class="study-back-btn" id="studyBackBtn">← BACK TO HOME</button>
                </div>
                <input class="study-search" id="studySearchInput" type="text" placeholder="🔍 Search by word or option..." value="${studyFilter}">
                <div style="color:#1d3e5c; font-weight:600; margin-bottom:14px;">Showing ${start+1}–${Math.min(start+STUDY_PER_PAGE, filtered.length)} of ${filtered.length} questions</div>`;

                pageQ.forEach((q, i) => {
                    html += `<div class="study-card">
                        <div class="q-word"><span style="background:#1d4e63; color:white; padding:2px 12px; border-radius:20px; font-size:0.9rem; margin-right:8px;">Q${q.id}</span>${q.question}</div>
                        <div class="q-options">`;
                    ['A','B','C','D'].forEach(opt => {
                        const isCorrect = opt === q.correctAnswer;
                        html += `<span class="${isCorrect ? 'correct-opt' : ''}">${opt}: ${q.options[opt]}</span>`;
                    });
                    html += `</div>
                        <div class="study-explain">✅ <strong>CORRECT ANSWER (${q.correctAnswer}):</strong> ${q.explanation.correct}</div>`;
                    if (q.explanation.wrong) {
                        html += `<div class="study-wrong">❌ <strong>WHY OTHERS ARE WRONG:</strong><br>`;
                        Object.entries(q.explanation.wrong).forEach(([opt, txt]) => {
                            html += `<span style="display:block; margin-top:4px;"><strong>${opt}:</strong> ${txt}</span>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });

                html += `<div class="study-pagination">
                    <button id="studyPrevPage" ${studyPage === 0 ? 'disabled' : ''}>← PREV</button>
                    <span class="page-info">Page ${studyPage+1} of ${totalPages}</span>
                    <button id="studyNextPage" ${studyPage >= totalPages-1 ? 'disabled' : ''}>NEXT →</button>
                </div>`;

                container.innerHTML = html;

                document.getElementById('studyBackBtn')?.addEventListener('click', restartExam);
                document.getElementById('studyPrevPage')?.addEventListener('click', () => { studyPage--; renderStudyPage(); container.scrollIntoView({behavior:'smooth'}); });
                document.getElementById('studyNextPage')?.addEventListener('click', () => { studyPage++; renderStudyPage(); container.scrollIntoView({behavior:'smooth'}); });
                document.getElementById('studySearchInput')?.addEventListener('input', function() {
                    studyFilter = this.value;
                    studyPage = 0;
                    renderStudyPage();
                });
            }

            // attach event to start button
            document.getElementById('startExamBtn').addEventListener('click', handleStartExam);
            document.getElementById('studyModeBtn').addEventListener('click', openStudyMode);

            // on page load, ensure exam container hidden, registration visible, show total questions
            document.getElementById('totalQDisplay').innerText = EXAM_SIZE;
            document.getElementById('examContainer').style.display = 'none';
            updateRecordsDisplay();
        })();
    </script>
</body>
</html>
